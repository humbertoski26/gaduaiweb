{% extends "base.html" %}
{% block title %}Nuevo colegio · Admin GADUAI{% endblock %}
{% block body %}
<div class="topbar">
  <strong>Admin GADUAI</strong>
  <a href="{{ url_for('admin_dashboard') }}">← Volver</a>
</div>
<div class="wrap">
  <h1>Nuevo colegio</h1>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Nombre del colegio</label>
    <input name="nombre" required autofocus>
    <label>Comuna (opcional)</label>
    <input name="comuna">
    <label>Correo de acceso del colegio</label>
    <input type="email" name="email" required>
    <label>Clave de acceso</label>
    <input type="text" name="password" required>
    <button class="btn" type="submit">Crear colegio</button>
  </form>
</div>
{% endblock %}

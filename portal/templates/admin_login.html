{% extends "base.html" %}
{% block title %}Admin · Portal GADUAI{% endblock %}
{% block body %}
<div class="wrap">
  <h1>Administrador GADUAI</h1>
  <p class="sub">Acceso restringido.</p>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Correo</label>
    <input type="email" name="email" required autofocus>
    <label>Clave</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
